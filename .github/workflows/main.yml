name: Build GPhotos Submodule

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android NDK and CMake
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build GPhotos Magisk Zip
        run: ./gradlew :GPhotos:buildZip --no-configuration-cache

      - name: Upload Magisk Module Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GPhotos-Magisk-Module-FINAL
          path: |
            GPhotos/build/outputs/zip/*.zip
            GPhotos/build/outputs/*.zip
            GPhotos/build/*.zip
            **/*.zip
