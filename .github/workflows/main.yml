name: Build GPhotos Submodule

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build GPhotos Module
        run: ./gradlew :GPhotos:module:zip || ./gradlew :GPhotos:assembleRelease || ./gradlew assembleRelease

      - name: Upload Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GPhotos-Magisk-Module
          path: "**/*.zip"
