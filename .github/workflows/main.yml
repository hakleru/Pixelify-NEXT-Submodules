name: Build GPhotos Submodule

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android NDK and CMake
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build GPhotos Submodule
        run: ./gradlew :GPhotos:zip || ./gradlew :GPhotos:assembleRelease || ./gradlew :GPhotos:build

      - name: Upload All Output Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GPhotos-Build-Output
          path: |
            **/build/outputs/**/*
            **/build/zip/*
            **/*.zip
            **/*.apk
