name: Build GPhotos Submodule

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build GPhotos
        run: ./gradlew :GPhotos:zip -x :spoofing || ./gradlew :GPhotos:assembleRelease -x :spoofing || ./gradlew :GPhotos:build -x :spoofing

      - name: Upload GPhotos Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GPhotos-Magisk-Module
          path: |
            GPhotos/**/build/**/*.zip
            GPhotos/out/*.zip
            GPhotos/**/*.zip
            **/GPhotos*.zip
